<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>تسجيل الدخول</title>
 <style>
 body{font-family:system-ui,sans-serif;margin:0;padding:1rem;text-align:right}
 form{max-width:400px;margin:2rem auto}
 input{width:100%;padding:.75rem;margin:.5rem 0}
 button{padding:.75rem;width:100%;cursor:pointer}
 </style>
</head>
<body>
 <form id="loginForm">
 <h2>تسجيل الدخول</h2>
 <input type="email" id="email" placeholder="البريد الإلكتروني" required>
 <input type="password" id="password" placeholder="كلمة المرور" required>
 <button type="submit">دخول</button>
 </form>
 <div id="loggedIn" style="display:none">
 <p id="userEmail">logged in as ...</p>
 <button id="logoutBtn">تسجيل الخروج</button>
 </div>

 <!-- Supabase JS pinned to exact version -->
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.4/dist/umd/supabase.min.js"></script>
 <script src="config.js"></script>
 <script>
 // Create client instance to avoid variable name conflict
 const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

 // Handle sign-in form submit
 document.getElementById("loginForm").addEventListener("submit", async (e) => {
 e.preventDefault();
 const email = document.getElementById("email").value;
 const password = document.getElementById("password").value;
 const { error } = await sb.auth.signInWithPassword({ email, password });
 if (error) return alert(error.message);
 loadSession();
 });

 // Handle logout
 document.getElementById("logoutBtn").addEventListener("click", async () => {
 await sb.auth.signOut();
 loadSession();
 });

 // Show logged-in vs logged-out state
 async function loadSession() {
 const { data: { session } } = await sb.auth.getSession();
 if (session) {
 document.getElementById("userEmail").textContent = "logged in as " + session.user.email;
 document.getElementById("loggedIn").style.display = "block";
 document.getElementById("loginForm").style.display = "none";
 } else {
 document.getElementById("loginForm").style.display = "block";
 document.getElementById("loggedIn").style.display = "none";
 }
 }
 loadSession();
 </script>
</body>
</html>
